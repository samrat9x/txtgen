<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TXT File Generator</title>
<style>
:root{--bg:#f7f6f3;--surface:#fff;--text:#1f1d1a;--muted:#6b665e;--border:#d9d5cc;--accent:#2f6f4f;--accent-text:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1917;--surface:#242321;--text:#ecE9e2;--muted:#9c978d;--border:#3a3835;--accent:#5fb98a;--accent-text:#0f1a14;--err:#f2b8b5}}
:root[data-theme="dark"]{--bg:#1a1917;--surface:#242321;--text:#ece9e2;--muted:#9c978d;--border:#3a3835;--accent:#5fb98a;--accent-text:#0f1a14;--err:#f2b8b5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px}
h1{font-size:1.3rem;margin:0 0 14px}
label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
input,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
textarea{min-height:50vh;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
.row>div{flex:1}
.ext{padding-bottom:10px;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
button{font:inherit;border-radius:10px;padding:10px 18px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:not-allowed}
#msg{font-size:.85rem;color:var(--muted)}
#msg.err{color:var(--err)}
</style>
</head>
<body>
<main>
<h1>TXT File Generator</h1>
<div class="row">
<div><label for="name">File name</label><input id="name" value="myfile" autocomplete="off"></div>
<span class="ext">.txt</span>
</div>
<label for="text">Text</label>
<textarea id="text" placeholder="Paste your text here…"></textarea>
<div class="bar">
<button class="primary" id="dl" disabled>Download .txt</button>
<button id="clear">Clear</button>
<span id="msg"></span>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const text=$('text'),name=$('name'),dl=$('dl'),msg=$('msg');
function say(t,err){msg.textContent=t;msg.className=err?'err':''}
text.addEventListener('input',()=>{dl.disabled=!text.value.length;say('')});
$('clear').onclick=()=>{text.value='';dl.disabled=true;say('');text.focus()};
dl.onclick=async()=>{
  let n=(name.value.trim()||'myfile').replace(/[\\/:*?"<>|]+/g,'_').replace(/\.txt$/i,'');
  try{
    const d=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null;
    if(d){
      await d.save({filename:n+'.txt',data:text.value});
    }else{
      const blob=new Blob(['\ufeff'+text.value],{type:'text/plain;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=n+'.txt';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }
    say('Saved.');
  }catch(e){
    if(e&&e.code==='declined')say('Cancelled.');
    else say('Could not save ('+((e&&e.code)||'error')+').',true);
  }
};
</script>
</body>
</html>
